<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QSB Tower V1.5 — Cockpit 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; padding: 0; height: 100%; background: #060a14; color: #cfe; font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace; overflow: hidden; }
  #scene { position: absolute; inset: 0; display: block; }
  .panel { position: absolute; background: rgba(10, 18, 28, 0.78); border: 1px solid rgba(80, 220, 180, 0.35); padding: 12px 14px; backdrop-filter: blur(10px); border-radius: 6px; box-shadow: 0 0 40px rgba(40, 220, 180, 0.07) inset, 0 6px 24px rgba(0,0,0,0.4); }
  #hud-top  { top: 14px; left: 14px; min-width: 280px; }
  #hud-stat { top: 14px; right: 14px; min-width: 240px; text-align: right; }
  #hud-foot { bottom: 14px; left: 14px; right: 14px; display: flex; gap: 24px; justify-content: space-between; align-items: center; font-size: 12px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-weight: 600; font-size: 11px; letter-spacing: 0.08em; }
  .pill.green  { background: rgba(50, 220, 110, 0.18); color: #6cf09e; border: 1px solid rgba(50, 220, 110, 0.46); }
  .pill.amber  { background: rgba(255, 184, 50, 0.18); color: #fbcc62; border: 1px solid rgba(255, 184, 50, 0.46); }
  .pill.red    { background: rgba(255, 80,  80, 0.18); color: #ff8a8a; border: 1px solid rgba(255, 80, 80, 0.46); }
  .pill.dim    { background: rgba(160, 180, 200, 0.12); color: #9ab; border: 1px solid rgba(160, 180, 200, 0.22); }
  h1 { margin: 0 0 4px 0; font-size: 15px; color: #8df0d8; letter-spacing: 0.16em; font-weight: 700; text-transform: uppercase; text-shadow: 0 0 10px rgba(80, 220, 180, 0.5); }
  .k { color: #6ad; font-size: 11px; letter-spacing: 0.06em; }
  .v { color: #dff; font-weight: 600; }
  #floor-tooltip { position: absolute; pointer-events: none; background: rgba(10, 18, 28, 0.95); border: 1px solid rgba(80, 220, 180, 0.50); padding: 8px 12px; font-size: 12px; border-radius: 5px; display: none; max-width: 300px; box-shadow: 0 6px 24px rgba(0,0,0,0.6); }
  #legend .sw { display: inline-block; width: 11px; height: 11px; vertical-align: middle; margin-right: 5px; border-radius: 2px; box-shadow: 0 0 8px currentColor; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="panel" id="hud-top">
  <h1>QSB Tower V1.5</h1>
  <div class="k">Cockpit 3D · Floor 49 Studio</div>
  <div style="margin-top:12px;">
    <div class="k">Floors registered: <span class="v" id="stat-floors">169</span></div>
    <div class="k">Workers registered: <span class="v" id="stat-workers">…</span></div>
    <div class="k">Live procs: <span class="v" id="stat-procs">…</span></div>
    <div class="k">Last activity: <span class="v" id="stat-last">…</span></div>
  </div>
</div>

<div class="panel" id="hud-stat">
  <div class="k">Tower state</div>
  <div style="margin-top: 10px;">
    <span class="pill green" id="cnt-idle">… idle</span>
    <span class="pill amber" id="cnt-working">… working</span>
    <span class="pill red"   id="cnt-blocked">… blocked</span>
    <br><br>
    <span class="pill dim"   id="cnt-paper">… paper-only</span>
  </div>
</div>

<div class="panel" id="hud-foot">
  <div id="legend">
    <span style="color:#39e070"><span class="sw" style="background:#39e070"></span>idle</span> &nbsp;
    <span style="color:#f6c45a"><span class="sw" style="background:#f6c45a"></span>working</span> &nbsp;
    <span style="color:#ff5050"><span class="sw" style="background:#ff5050"></span>blocked</span> &nbsp;
    <span style="color:#80a0c0"><span class="sw" style="background:#80a0c0"></span>paper-only</span>
  </div>
  <div class="k">drag rotate · scroll zoom · hover floor for detail</div>
  <div class="k">refresh 5s · GET /api/floor_states</div>
</div>

<div id="floor-tooltip"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { Sky } from 'three/addons/objects/Sky.js';

// ──────────────────────────────────────────────────────────────────
// Tower geometry — 169 floors, wider footprint so it reads as a tower
// not a sliver
// ──────────────────────────────────────────────────────────────────
const N_FLOORS = 169;
const FLOOR_H = 0.55;             // each slab thickness
const FLOOR_W = 14.0;             // wide enough to dominate the view
const FLOOR_D = 14.0;
const TOWER_H = N_FLOORS * FLOOR_H;  // ~93 units

const STATUS_COLOR = {
  idle:        new THREE.Color(0x39e070),
  working:     new THREE.Color(0xf6c45a),
  blocked:     new THREE.Color(0xff5050),
  paper_only:  new THREE.Color(0x80a0c0),
};
const STATUS_EMISSIVE = {
  idle:        new THREE.Color(0x125a30),
  working:     new THREE.Color(0x6a4d12),
  blocked:     new THREE.Color(0x6a1a1a),
  paper_only:  new THREE.Color(0x1a2638),
};

const canvas   = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();

// ── Atmospheric sky (Three.js Sky shader) — dusk gradient ─────────
const sky = new Sky();
sky.scale.setScalar(2000);
scene.add(sky);
sky.material.uniforms.turbidity.value = 8.0;
sky.material.uniforms.rayleigh.value = 2.4;
sky.material.uniforms.mieCoefficient.value = 0.008;
sky.material.uniforms.mieDirectionalG.value = 0.95;
const sunAngle = THREE.MathUtils.degToRad(78);  // low, dusky
const sun = new THREE.Vector3();
sun.setFromSphericalCoords(1, sunAngle, THREE.MathUtils.degToRad(220));
sky.material.uniforms.sunPosition.value.copy(sun);
scene.fog = new THREE.FogExp2(0x1a2840, 0.0035);

// ── Camera framed on the whole tower (intro dollys in from far) ───
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 1500);
const CAM_FAR = new THREE.Vector3(180, TOWER_H * 0.95, 180);
const CAM_HOME = new THREE.Vector3(45, TOWER_H * 0.62, 45);
camera.position.copy(CAM_FAR);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, TOWER_H * 0.45, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance   = 18;
controls.maxDistance   = 260;
controls.maxPolarAngle = Math.PI * 0.49;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.18;
controls.enabled = false;   // disabled during intro, re-enabled after

// Intro dolly: lerp camera from CAM_FAR -> CAM_HOME over INTRO_MS
const INTRO_MS = 3000;
let introT0 = 0;
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function updateIntro(tNow) {
  if (!introT0) introT0 = tNow;
  const k = Math.min(1, (tNow - introT0) / INTRO_MS);
  const ek = easeOutCubic(k);
  camera.position.lerpVectors(CAM_FAR, CAM_HOME, ek);
  if (k >= 1) {
    controls.enabled = true;
    return true;   // done
  }
  return false;
}

// ── Lighting ──────────────────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x6680a0, 0.85));
const key = new THREE.DirectionalLight(0xfff0d8, 1.6);
key.position.set(50, 80, 30); scene.add(key);
const fill = new THREE.DirectionalLight(0x7090b0, 0.7);
fill.position.set(-40, 50, -30); scene.add(fill);
const rim = new THREE.PointLight(0x44ffd0, 2.4, 110, 1.4);
rim.position.set(0, TOWER_H + 8, 0); scene.add(rim);

// ── Ground reflection plate + grid ────────────────────────────────
const grd = new THREE.Mesh(
  new THREE.CircleGeometry(120, 80),
  new THREE.MeshStandardMaterial({
    color: 0x141e30, metalness: 0.55, roughness: 0.5, side: THREE.DoubleSide
  })
);
grd.rotation.x = -Math.PI / 2; grd.position.y = -0.4; scene.add(grd);
const grid = new THREE.GridHelper(120, 30, 0x4480a0, 0x244464);
grid.position.y = -0.35;
grid.material.transparent = true; grid.material.opacity = 0.32;
scene.add(grid);

// ── Window-grid emissive texture for the floors ───────────────────
function makeWindowTexture() {
  const W = 256, H = 64, cols = 24, rows = 4;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#08101a';
  g.fillRect(0, 0, W, H);
  for (let r = 0; r < rows; r++) {
    for (let x = 0; x < cols; x++) {
      const lit = Math.random() < 0.78;
      g.fillStyle = lit ? '#ffe488' : '#1a2638';
      const wx = (W / cols) * x + 1.0;
      const wy = (H / rows) * r + 1.0;
      const ww = (W / cols) - 2.0;
      const wh = (H / rows) - 2.0;
      g.fillRect(wx, wy, ww, wh);
    }
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const winTex = makeWindowTexture();

// ── Floor slabs — instanced for performance ───────────────────────
const slabGeo = new THREE.BoxGeometry(FLOOR_W, FLOOR_H * 0.9, FLOOR_D);
const slabMat = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  metalness: 0.35, roughness: 0.42,
  emissive: 0xffffff, emissiveIntensity: 0.55,
  emissiveMap: winTex,
});
const slabs = new THREE.InstancedMesh(slabGeo, slabMat, N_FLOORS);
const _m = new THREE.Matrix4();
for (let i = 0; i < N_FLOORS; i++) {
  _m.makeTranslation(0, i * FLOOR_H + FLOOR_H * 0.5, 0);
  slabs.setMatrixAt(i, _m);
  slabs.setColorAt(i, STATUS_COLOR.paper_only);
}
scene.add(slabs);

// ── Glassy outer skin ─────────────────────────────────────────────
const skinGeo = new THREE.BoxGeometry(FLOOR_W * 1.025, TOWER_H, FLOOR_D * 1.025);
const skinMat = new THREE.MeshPhysicalMaterial({
  color: 0x9ed0e8, transmission: 0.92, thickness: 0.6,
  roughness: 0.04, metalness: 0.0, ior: 1.5,
  attenuationColor: 0xb0e0ff, attenuationDistance: 5.0,
  clearcoat: 0.95, clearcoatRoughness: 0.10,
  envMapIntensity: 1.2, transparent: true, opacity: 0.22,
  side: THREE.DoubleSide,
});
const skin = new THREE.Mesh(skinGeo, skinMat);
skin.position.y = TOWER_H / 2; scene.add(skin);

// ── Edge wireframe for crisp silhouette ───────────────────────────
const edges = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(FLOOR_W * 1.025, TOWER_H, FLOOR_D * 1.025)),
  new THREE.LineBasicMaterial({ color: 0x88c0e0, transparent: true, opacity: 0.55 })
);
edges.position.y = TOWER_H / 2; scene.add(edges);

// ── Spire & antenna ───────────────────────────────────────────────
const spire = new THREE.Mesh(
  new THREE.ConeGeometry(0.5, 6.0, 16),
  new THREE.MeshStandardMaterial({
    color: 0x88e8d0, metalness: 0.7, roughness: 0.25,
    emissive: 0x44ccaa, emissiveIntensity: 1.1
  })
);
spire.position.y = TOWER_H + 3.0; scene.add(spire);
const antenna = new THREE.Mesh(
  new THREE.CylinderGeometry(0.05, 0.05, 4.0, 8),
  new THREE.MeshBasicMaterial({ color: 0xff5566 })
);
antenna.position.y = TOWER_H + 8.0; scene.add(antenna);
const beacon = new THREE.PointLight(0xff5566, 4.0, 60, 1.5);
beacon.position.y = TOWER_H + 10.0; scene.add(beacon);

// ── Lifts: 4 cabs running up/down the tower spine ─────────────────
// Per CLAUDE.md: "Inter-floor communication travels through lifts. Lifts
// carry sealed packets." Visualised as four small glowing cabs at the
// four corners of the tower footprint, animated continuously.
const LIFT_COUNT = 4;
const LIFT_R = FLOOR_W * 0.46;  // just inside the skin
const LIFT_W = 0.6;
const LIFT_H = FLOOR_H * 1.6;
const lifts = [];
const liftCabGeo = new THREE.BoxGeometry(LIFT_W, LIFT_H, LIFT_W);
const liftCabMat = new THREE.MeshStandardMaterial({
  color: 0xfff0c0, metalness: 0.4, roughness: 0.25,
  emissive: 0xffe488, emissiveIntensity: 1.6
});
const liftShaftMat = new THREE.LineBasicMaterial({
  color: 0x4a708a, transparent: true, opacity: 0.35
});
for (let i = 0; i < LIFT_COUNT; i++) {
  const angle = (i / LIFT_COUNT) * Math.PI * 2 + Math.PI * 0.25;
  const cx = Math.cos(angle) * LIFT_R;
  const cz = Math.sin(angle) * LIFT_R;
  // shaft (vertical line)
  const shaftGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(cx, 0, cz),
    new THREE.Vector3(cx, TOWER_H, cz),
  ]);
  scene.add(new THREE.Line(shaftGeo, liftShaftMat));
  // cab
  const cab = new THREE.Mesh(liftCabGeo, liftCabMat);
  cab.position.set(cx, FLOOR_H, cz);
  scene.add(cab);
  // soft glow around cab (sealed packet)
  const glow = new THREE.PointLight(0xffe488, 0.9, 8.0, 1.5);
  glow.position.copy(cab.position);
  scene.add(glow);
  lifts.push({
    cab, glow, x: cx, z: cz,
    phase: (i / LIFT_COUNT),  // staggered start
    speed: 0.06 + i * 0.012,  // slightly different speeds
    direction: i % 2 === 0 ? 1 : -1,
  });
}

// ── Landmark floor labels ─────────────────────────────────────────
const LANDMARKS = [
  { floor: 0,   label: "F0 Reception" },
  { floor: 25,  label: "F25 Recruitment" },
  { floor: 41,  label: "F41 OANDA" },
  { floor: 47,  label: "F47 Workshop" },
  { floor: 49,  label: "F49 Studio" },
  { floor: 50,  label: "F50 Classroom" },
  { floor: 60,  label: "F60 LSE" },
  { floor: 100, label: "F100 Press" },
  { floor: 150, label: "F150 Botanical" },
  { floor: 165, label: "F165 Vision" },
];

function makeLabelSprite(text) {
  const W = 360, H = 64;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = 'rgba(8, 14, 24, 0.85)';
  g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(80, 220, 180, 0.6)';
  g.lineWidth = 2;
  g.strokeRect(1, 1, W - 2, H - 2);
  g.font = 'bold 26px ui-monospace, "JetBrains Mono", Menlo';
  g.fillStyle = '#88f0d8';
  g.textBaseline = 'middle';
  g.textAlign = 'center';
  g.fillText(text, W / 2, H / 2);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  const m = new THREE.SpriteMaterial({ map: t, transparent: true, depthWrite: false });
  const s = new THREE.Sprite(m);
  s.scale.set(8.4, 1.5, 1);
  return s;
}

for (const lm of LANDMARKS) {
  const s = makeLabelSprite(lm.label);
  s.position.set(FLOOR_W * 0.85, lm.floor * FLOOR_H + FLOOR_H * 0.5, FLOOR_D * 0.85);
  scene.add(s);
}

// ── Floating data particles around the tower ──────────────────────
const PARTICLE_COUNT = 600;
const partGeo = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const seeds = new Float32Array(PARTICLE_COUNT);
for (let i = 0; i < PARTICLE_COUNT; i++) {
  const angle = Math.random() * Math.PI * 2;
  const r = 18 + Math.random() * 60;
  positions[i * 3 + 0] = Math.cos(angle) * r;
  positions[i * 3 + 1] = Math.random() * TOWER_H + 4;
  positions[i * 3 + 2] = Math.sin(angle) * r;
  seeds[i] = Math.random();
}
partGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
partGeo.setAttribute('seed', new THREE.BufferAttribute(seeds, 1));
const partMat = new THREE.PointsMaterial({
  color: 0x88f0d8, size: 0.18, transparent: true, opacity: 0.7,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
const particles = new THREE.Points(partGeo, partMat);
scene.add(particles);

// ── Post-process: bloom ───────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(
  new THREE.Vector2(innerWidth, innerHeight), 0.75, 0.55, 0.78
));

// ── Floor metadata ────────────────────────────────────────────────
const floorState = new Array(N_FLOORS).fill(null).map((_, i) => ({
  floor: i + 1, status: 'paper_only', name: `Floor ${i + 1}`,
  workers: 0, last_tick: null
}));

function paintFloors() {
  for (let i = 0; i < N_FLOORS; i++) {
    const c = STATUS_COLOR[floorState[i].status] || STATUS_COLOR.paper_only;
    slabs.setColorAt(i, c);
  }
  if (slabs.instanceColor) slabs.instanceColor.needsUpdate = true;
  let cnt = { idle: 0, working: 0, blocked: 0, paper_only: 0 };
  for (const f of floorState) cnt[f.status] = (cnt[f.status] || 0) + 1;
  document.getElementById('cnt-idle').textContent    = `${cnt.idle} idle`;
  document.getElementById('cnt-working').textContent = `${cnt.working} working`;
  document.getElementById('cnt-blocked').textContent = `${cnt.blocked} blocked`;
  document.getElementById('cnt-paper').textContent   = `${cnt.paper_only} paper-only`;
}

async function refresh() {
  try {
    const r = await fetch('/api/floor_states', { cache: 'no-store' });
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('stat-workers').textContent = d.totals?.workers_registered ?? '—';
    document.getElementById('stat-procs').textContent   = d.totals?.live_procs ?? '—';
    document.getElementById('stat-last').textContent    = (d.totals?.last_activity_ts ?? '—').replace('T',' ').replace('Z',' UTC');
    for (const f of d.floors || []) {
      const idx = f.floor - 1;
      if (idx >= 0 && idx < N_FLOORS) {
        floorState[idx].status   = f.status   || 'paper_only';
        floorState[idx].name     = f.name     || floorState[idx].name;
        floorState[idx].workers  = f.workers  || 0;
        floorState[idx].last_tick= f.last_tick || null;
      }
    }
    paintFloors();
  } catch (e) { /* network blip */ }
}
refresh();
setInterval(refresh, 5000);

// ── Hover tooltip ─────────────────────────────────────────────────
const tooltip = document.getElementById('floor-tooltip');
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
canvas.addEventListener('pointermove', (ev) => {
  const r = canvas.getBoundingClientRect();
  pointer.x = ((ev.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((ev.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObject(slabs, false);
  if (hit.length) {
    const id = hit[0].instanceId;
    const f = floorState[id];
    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX + 14) + 'px';
    tooltip.style.top  = (ev.clientY + 14) + 'px';
    tooltip.innerHTML = `<b>${f.name}</b><br>floor ${f.floor} · <span class="pill ${pillFor(f.status)}">${f.status}</span><br>workers: ${f.workers}<br>last tick: ${f.last_tick ?? '—'}`;
  } else {
    tooltip.style.display = 'none';
  }
});
function pillFor(s) { return s === 'idle' ? 'green' : s === 'working' ? 'amber' : s === 'blocked' ? 'red' : 'dim'; }
canvas.addEventListener('mousedown', () => { controls.autoRotate = false; });

// ── Resize ────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// ── Render loop with particle drift + beacon pulse + lifts ────────
let tStart = 0;
let introDone = false;
function frame(t) {
  if (!tStart) tStart = t;
  const dt = (t - tStart) / 1000;
  if (!introDone) introDone = updateIntro(t);
  controls.update();
  spire.rotation.y += 0.005;
  beacon.intensity = 3.0 + Math.sin(dt * 3.5) * 1.5;
  // lift cabs: travel up/down the tower; bounce at top/bottom
  for (const lf of lifts) {
    const newY = lf.cab.position.y + lf.direction * lf.speed;
    if (newY > TOWER_H - LIFT_H * 0.5) {
      lf.direction = -1;
    } else if (newY < LIFT_H * 0.5) {
      lf.direction = 1;
    }
    lf.cab.position.y = lf.cab.position.y + lf.direction * lf.speed;
    lf.glow.position.copy(lf.cab.position);
    lf.glow.intensity = 0.8 + Math.sin(dt * 4 + lf.phase * 6) * 0.4;
  }
  // particle drift
  const pos = particles.geometry.attributes.position;
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const y0 = pos.array[i * 3 + 1];
    pos.array[i * 3 + 1] = y0 + (0.04 + seeds[i] * 0.08);
    if (pos.array[i * 3 + 1] > TOWER_H + 8) {
      pos.array[i * 3 + 1] = 4;
      const angle = Math.random() * Math.PI * 2;
      const r = 18 + Math.random() * 60;
      pos.array[i * 3 + 0] = Math.cos(angle) * r;
      pos.array[i * 3 + 2] = Math.sin(angle) * r;
    }
  }
  pos.needsUpdate = true;
  composer.render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
